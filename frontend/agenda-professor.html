<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensalamento — Agenda do professor</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/configuracao.js"></script>
</head>
<body>
    <header class="cabecalho" id="cabecalho-app"></header>

    <main class="contentor">
        <div class="abas" role="tablist" aria-label="Modo de visualização">
            <button class="botao" role="tab" aria-selected="true" id="aba-dia" type="button">Hoje</button>
            <button class="botao" role="tab" aria-selected="false" id="aba-semana" type="button">Semana</button>
        </div>

        <div class="cartao" id="area-agenda">
            <p class="mensagem-estado">Carregando agenda...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/autenticacao.js"></script>
    <script src="js/componentesCabecalho.js"></script>
    <script src="js/paginaAgendaProfessor.js"></script>
</body>
</html>
