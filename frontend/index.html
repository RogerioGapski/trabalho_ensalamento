<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensalamento — Entrar</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/configuracao.js"></script>
</head>
<body>
    <main class="contentor contentor--estreito" style="padding-top: 4rem;">
        <div class="cartao" style="text-align: center;">
            <h1 style="margin-top: 0;">Ensalamento</h1>
            <p style="color: var(--cor-texto-suave);">Entre com sua conta institucional para consultar horários e salas.</p>

            <div id="container-botao-google" style="margin: 1.5rem 0 1rem; display: flex; justify-content: center;"></div>

            <button class="botao botao-provedor" id="botao-microsoft" type="button">
                Continuar com Microsoft
            </button>

            <p class="mensagem-erro" data-papel="mensagem-erro-login" hidden></p>
        </div>
    </main>

    <footer class="rodape-academico">
        <p>Trabalho acadêmico — não é uma publicação institucional oficial.</p>
        <p><a href="sobre.html">Sobre este projeto</a></p>
    </footer>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/autenticacao.js"></script>
    <script>
        Autenticacao.inicializarBotaoGoogle("container-botao-google");

        document.getElementById("botao-microsoft").addEventListener("click", function () {
            Autenticacao.tratarLoginMicrosoft();
        });

        Autenticacao.carregarUsuarioAtual().then(function (usuario) {
            if (usuario) {
                Autenticacao.redirecionarConformePapel(usuario.papel);
            }
        });
    </script>
</body>
</html>
