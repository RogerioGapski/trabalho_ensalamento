<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ensalamento — Painel do coordenador</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/configuracao.js"></script>
</head>
<body>
    <header class="cabecalho" id="cabecalho-app"></header>

    <main class="contentor">
        <div class="cartao">
            <h1 style="margin-top: 0;">Minhas turmas</h1>
            <p style="color: var(--cor-texto-suave);">
                Informe tamanho, necessidades obrigatórias e preferências de cada turma. Depois de enviar, a turma
                fica bloqueada para edição até ser devolvida pelo administrador.
            </p>
        </div>

        <div id="lista-turmas-coordenador"></div>
    </main>

    <div class="sobreposicao-modal" id="sobreposicao-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-turma">
            <div class="modal__cabecalho">
                <h2 id="titulo-modal-turma">Necessidades da turma</h2>
                <button class="botao" id="botao-fechar-modal" type="button" aria-label="Fechar">✕</button>
            </div>
            <div class="modal__corpo" id="corpo-modal-turma"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/autenticacao.js"></script>
    <script src="js/componentesCabecalho.js"></script>
    <script src="js/paginaPainelCoordenador.js"></script>
</body>
</html>
